<style>
  html,body{margin:0;padding:0;height:100%;background:#0d1a13;overflow:hidden}
  #f{position:fixed;inset:0;width:100%;height:100%;border:0}

  /* ===== 인트로 ===== */
  #intro{position:fixed;inset:0;z-index:50;background:#0d1a13;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
  #intro.out{animation:introOut .7s ease forwards}
  @keyframes introOut{to{opacity:0;visibility:hidden}}

  /* 잔디 + 조명 */
  #intro .turf{position:absolute;inset:0;
    background:radial-gradient(820px 460px at 50% 116%, #2c7a50 0%, #17452f 44%, #0d1a13 76%)}
  #intro .stripes{position:absolute;left:-16%;right:-16%;bottom:0;height:34%;opacity:.13;
    background:repeating-linear-gradient(90deg,#fff 0 30px,transparent 30px 64px);
    transform:perspective(260px) rotateX(66deg);transform-origin:bottom}
  #intro .arc{position:absolute;left:50%;bottom:6%;width:min(150vw,560px);height:210px;
    margin-left:min(-75vw,-280px);border-radius:50%/100% 100% 0 0;
    border-top:3px solid rgba(255,255,255,.14);opacity:0;
    animation:fadeIn 1.2s ease .5s forwards}
  @keyframes fadeIn{to{opacity:1}}

  #intro .lamp{position:absolute;top:5%;width:15px;height:15px;border-radius:50%;
    background:#fff6d8;box-shadow:0 0 26px 11px rgba(255,236,180,.75);opacity:0;
    animation:lamp 2.4s ease-out forwards}
  #intro .lamp.l{left:15%}#intro .lamp.r{right:15%;animation-delay:.16s}
  @keyframes lamp{0%{opacity:0;transform:scale(.4)}14%{opacity:1;transform:scale(1)}
    22%{opacity:.15}34%{opacity:1}44%{opacity:.4}100%{opacity:.95}}
  #intro .beam{position:absolute;top:5.6%;width:320px;height:74%;opacity:0;
    background:linear-gradient(to bottom,rgba(255,238,190,.26),rgba(255,238,190,0) 76%);
    clip-path:polygon(47.5% 0,52.5% 0,100% 100%,0 100%);
    mix-blend-mode:screen;animation:beamIn 1.8s ease-out .34s forwards}
  #intro .beam.l{left:15%;margin-left:-153px}
  #intro .beam.r{right:15%;margin-right:-153px;animation-delay:.5s}
  @keyframes beamIn{0%{opacity:0}60%{opacity:.55}100%{opacity:.85}}
  #intro .pool{position:absolute;left:50%;top:40%;width:600px;height:340px;margin-left:-300px;
    background:radial-gradient(closest-side,rgba(255,236,180,.20),transparent 72%);
    mix-blend-mode:screen;opacity:0;animation:fadeIn 1.4s ease 1.85s forwards}

  /* 날아오는 공 */
  #intro .fly{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;
    opacity:0;filter:drop-shadow(0 6px 16px rgba(0,0,0,.55));
    animation:fly 1.45s cubic-bezier(.22,.66,.36,1) .6s forwards}
  @keyframes fly{
    0%{opacity:0;transform:translate(-330px,150px) scale(.3) rotate(0)}
    10%{opacity:1}
    72%{opacity:1;transform:translate(18px,-16px) scale(1.55) rotate(820deg)}
    88%{opacity:1;transform:translate(30px,-30px) scale(2.2) rotate(940deg)}
    100%{opacity:0;transform:translate(38px,-38px) scale(3) rotate(1000deg)}}
  #intro .trail{position:absolute;left:50%;top:50%;width:150px;height:5px;border-radius:4px;
    margin:-2px 0 0 -75px;transform-origin:right center;opacity:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.55));
    animation:trail 1.45s cubic-bezier(.22,.66,.36,1) .6s forwards}
  @keyframes trail{
    0%{opacity:0;transform:translate(-330px,150px) rotate(-24deg) scaleX(.3)}
    16%{opacity:.7}
    72%{opacity:.5;transform:translate(18px,-16px) rotate(-24deg) scaleX(1)}
    100%{opacity:0;transform:translate(38px,-38px) rotate(-24deg) scaleX(1.2)}}
  #intro .flash{position:absolute;inset:0;background:radial-gradient(closest-side,#fff,rgba(255,255,255,.2) 62%,transparent 78%);
    opacity:0;animation:flash .55s ease-out 1.92s forwards}
  @keyframes flash{0%{opacity:0;transform:scale(.6)}18%{opacity:.95;transform:scale(1)}100%{opacity:0;transform:scale(1.35)}}

  /* 로고 */
  #intro .logo{position:relative;text-align:center;opacity:0;
    animation:stamp .95s cubic-bezier(.2,1.5,.4,1) 2.12s forwards}
  @keyframes stamp{0%{opacity:0;transform:scale(1.75) rotate(-7deg)}
    58%{opacity:1;transform:scale(.97) rotate(1deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
  #intro .logo svg{display:block;width:min(78vw,340px);height:auto;margin:0 auto;
    filter:drop-shadow(0 12px 30px rgba(0,0,0,.6))}
  #intro .tag{margin-top:16px;font-size:15px;font-weight:800;letter-spacing:5px;
    color:#9fd3b4;opacity:0;animation:tagIn .9s ease 3.06s forwards}
  @keyframes tagIn{0%{opacity:0;transform:translateY(12px)}100%{opacity:1;transform:none}}
  #intro .line{margin:14px auto 0;width:0;height:2px;border-radius:2px;
    background:linear-gradient(90deg,transparent,#4fae7c,transparent);
    animation:lineIn 1s ease 3.2s forwards}
  @keyframes lineIn{to{width:min(66vw,280px)}}

  #skip{position:fixed;right:16px;bottom:20px;z-index:51;border:0;cursor:pointer;
    background:rgba(255,255,255,.12);color:#cfe3d7;font-family:inherit;
    font-size:13px;font-weight:800;padding:10px 16px;border-radius:999px;
    opacity:0;animation:skipIn .6s ease 1.1s forwards}
  @keyframes skipIn{to{opacity:1}}
  #skip:active{transform:scale(.96)}

  /* ===== 음악 컨트롤 ===== */
  #mus{position:fixed;right:14px;bottom:14px;z-index:40;
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
  #musBtn{width:46px;height:46px;border-radius:50%;border:0;cursor:pointer;
    background:rgba(16,32,24,.82);color:#fff;font-size:19px;
    box-shadow:0 6px 20px rgba(0,0,0,.42);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;transition:transform .1s}
  #musBtn:active{transform:scale(.93)}
  #musBtn.on{background:#1c7c4a}
  #musBtn .eq{display:flex;gap:2.5px;align-items:flex-end;height:16px}
  #musBtn .eq i{width:3px;background:#fff;border-radius:2px;height:5px}
  #musBtn.on .eq i:nth-child(1){animation:eq .62s ease-in-out infinite}
  #musBtn.on .eq i:nth-child(2){animation:eq .48s ease-in-out infinite .1s}
  #musBtn.on .eq i:nth-child(3){animation:eq .72s ease-in-out infinite .2s}
  @keyframes eq{0%,100%{height:5px}50%{height:15px}}
  #musPanel{position:absolute;right:0;bottom:56px;width:250px;padding:12px;
    background:rgba(16,32,24,.95);border:1px solid rgba(255,255,255,.12);border-radius:16px;
    box-shadow:0 12px 34px rgba(0,0,0,.5);backdrop-filter:blur(10px);
    opacity:0;visibility:hidden;transform:translateY(8px);transition:.18s ease}
  #musPanel.open{opacity:1;visibility:visible;transform:none}
  #musPanel h4{margin:0 0 9px;font-size:12px;font-weight:800;color:#8fd0a8;letter-spacing:.5px}
  #musPanel .tr{display:flex;align-items:center;gap:9px;width:100%;text-align:left;cursor:pointer;
    background:transparent;border:1.5px solid transparent;border-radius:11px;padding:9px;
    color:#e8f2ec;font-family:inherit;margin-bottom:5px;transition:.12s}
  #musPanel .tr:hover{background:rgba(255,255,255,.07)}
  #musPanel .tr.sel{border-color:#2f9e5f;background:rgba(47,158,95,.16)}
  #musPanel .tr .ic{font-size:17px;flex:none}
  #musPanel .tr b{display:block;font-size:13px;font-weight:800;letter-spacing:-.2px}
  #musPanel .tr span{display:block;font-size:10.5px;color:#9fb8ab;font-weight:600;margin-top:1px}
  #musPanel .off{width:100%;margin-top:4px;padding:9px;border-radius:11px;cursor:pointer;
    background:rgba(255,255,255,.09);border:0;color:#cfe3d7;font-family:inherit;
    font-size:12.5px;font-weight:800}
  #musHint{position:absolute;right:54px;bottom:10px;white-space:nowrap;
    background:rgba(16,32,24,.9);color:#cfe3d7;font-size:11.5px;font-weight:700;
    padding:7px 11px;border-radius:999px;opacity:0;transition:.3s;pointer-events:none}
  #musHint.show{opacity:1}
</style>

/* ============ 사운드 엔진 (Web Audio · 전부 실시간 합성) ============ */
var AC=null, MASTER=null, NOISE=null, playing=false, curTrack=0,
    stepIdx=0, nextT=0, schedTimer=null;

var SEMI={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
function fq(n){var m=/^([A-G]#?)(-?\d)$/.exec(n);if(!m)return 0;
  return 440*Math.pow(2,(SEMI[m[1]]+(+m[2]-4)*12-9)/12);}
function P(s){return s.trim().split(/\s+/);}   /* 패턴 문자열 → 배열 */

function initAudio(){
  if(AC)return;
  var Ctx=window.AudioContext||window.webkitAudioContext; if(!Ctx)return;
  AC=new Ctx();
  MASTER=AC.createGain(); MASTER.gain.value=0; MASTER.connect(AC.destination);
  var len=AC.sampleRate*1.2, buf=AC.createBuffer(1,len,AC.sampleRate), d=buf.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  NOISE=buf;
}
function tone(t,f,dur,o){o=o||{};
  var osc=AC.createOscillator(), g=AC.createGain();
  osc.type=o.type||'sine'; osc.frequency.value=f; if(o.detune)osc.detune.value=o.detune;
  var gain=o.gain||.2;
  g.gain.setValueAtTime(.0001,t);
  g.gain.exponentialRampToValueAtTime(gain,t+(o.attack||.012));
  g.gain.setTargetAtTime(.0001,t+dur,(o.rel||.12));
  osc.connect(g); g.connect(MASTER); osc.start(t); osc.stop(t+dur+.9);
}
function organ(t,f,dur,g){ /* 오르간: 배음 스택 */
  tone(t,f,dur,{type:'sine',gain:g,rel:.1});
  tone(t,f*2,dur,{type:'sine',gain:g*.46,rel:.1});
  tone(t,f*3,dur,{type:'triangle',gain:g*.24,rel:.09});
  tone(t,f*4,dur,{type:'sine',gain:g*.13,rel:.08});
}
function pad(t,f,dur,g){
  tone(t,f,dur,{type:'triangle',gain:g,attack:.28,rel:.5});
  tone(t,f*1.005,dur,{type:'sine',gain:g*.7,attack:.34,rel:.5});
}
function bassV(t,f,dur,g){
  var o=AC.createOscillator(),gn=AC.createGain(),fl=AC.createBiquadFilter();
  o.type='sawtooth'; o.frequency.value=f;
  fl.type='lowpass'; fl.frequency.value=430; fl.Q.value=6;
  gn.gain.setValueAtTime(.0001,t);
  gn.gain.exponentialRampToValueAtTime(g,t+.02);
  gn.gain.setTargetAtTime(.0001,t+dur*.72,.07);
  o.connect(fl); fl.connect(gn); gn.connect(MASTER); o.start(t); o.stop(t+dur+.5);
}
function noiseHit(t,dur,g,type,freq,q){
  var s=AC.createBufferSource(),fl=AC.createBiquadFilter(),gn=AC.createGain();
  s.buffer=NOISE; fl.type=type; fl.frequency.value=freq; if(q)fl.Q.value=q;
  gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(fl); fl.connect(gn); gn.connect(MASTER); s.start(t); s.stop(t+dur+.05);
}
function kick(t,g){
  var o=AC.createOscillator(),gn=AC.createGain();
  o.type='sine'; o.frequency.setValueAtTime(140,t);
  o.frequency.exponentialRampToValueAtTime(42,t+.11);
  gn.gain.setValueAtTime(g,t); gn.gain.exponentialRampToValueAtTime(.0001,t+.26);
  o.connect(gn); gn.connect(MASTER); o.start(t); o.stop(t+.3);
}
function clap(t,g){ noiseHit(t,.13,g,'bandpass',1750,7); }
function hat(t,g){ noiseHit(t,.035,g,'highpass',7600); }
function stick(t,g){ noiseHit(t,.05,g,'bandpass',2600,4); tone(t,880,.03,{type:'square',gain:g*.4,rel:.02}); }

    if(this.mel[s]!=='.')organ(t,fq(this.mel[s]),.26,.085);
    if(this.bas[s]!=='.')bassV(t,fq(this.bas[s]),.26,.2);
    if(b===0||b===6||b===10)this.chd[bar].forEach(function(n){organ(t,fq(n),.3,.036);});
    if(b%2===0)hat(t,.028); if(b===4||b===12)clap(t,.12); if(b===0||b===8)kick(t,.4);}},

{ name:'응원 리듬', ic:'📣', desc:'막대풍선 두드리는 3-3-2 응원 박자', bpm:126,
  mel:P(". . . . . . . . C5 . . . C5 . D5 .  . . . . . . . . E5 . . . D5 . C5 .  . . . . . . . . G4 . . . A4 . C5 .  . . . . . . . . D5 . C5 . G4 . . ."),
  bas:P("A2 . . A2 . . A2 . . A2 . . A2 . . .  F2 . . F2 . . F2 . . F2 . . F2 . . .  C3 . . C3 . . C3 . . C3 . . C3 . . .  G2 . . G2 . . G2 . . G2 . . G2 . . ."),
  clp:P("x . . x . . x . . x . . x . . .  x . . x . . x . . x . . x . . .  x . . x . . x . . x . . x . . .  x . . x . . x . . x . x . x . x ."),
  step:function(t,s){var b=s&15;
    if(this.mel[s]!=='.')organ(t,fq(this.mel[s]),.2,.075);
    if(this.bas[s]!=='.')bassV(t,fq(this.bas[s]),.16,.19);
    if(this.clp[s]==='x')clap(t,.15);
    if(b===0||b===8)kick(t,.46); if(b===4||b===12)stick(t,.1); if(b%2===1)hat(t,.02);}},

{ name:'경기 전', ic:'🌇', desc:'플레이볼 직전, 잔잔한 구장의 오후', bpm:82,
  arp:P("A3 . E4 . C4 . E4 . A3 . E4 . C4 . E4 .  F3 . C4 . A3 . C4 . F3 . C4 . A3 . C4 .  C4 . G4 . E4 . G4 . C4 . G4 . E4 . G4 .  G3 . D4 . B3 . D4 . G3 . D4 . B3 . D4 ."),
  pd:[['A3','C4','E4'],['F3','A3','C4'],['C4','E4','G4'],['G3','B3','D4']],
  step:function(t,s){var b=s&15,bar=(s>>4)&3;
    if(this.arp[s]!=='.')tone(t,fq(this.arp[s]),.42,{type:'sine',gain:.055,attack:.03,rel:.3});
    if(b===0)this.pd[bar].forEach(function(n){pad(t,fq(n),1.5,.032);});
    if(b===0)bassV(t,fq(['A1','F1','C2','G1'][bar]),.9,.13);
    if(b===8)hat(t,.012);}},

{ name:'9회말', ic:'🔥', desc:'한 점 차, 마지막 이닝의 긴장감', bpm:142,
  mel:P("D4 . . . D4 . F4 . A4 . . . F4 . . .  D4 . . . D4 . F4 . C5 . . . A4 . . .  A#4 . . . A4 . F4 . D4 . . . A3 . . .  C5 . . . A#4 . A4 . F4 . . . . . . ."),
  bas:P("D2 . D2 . D2 . D2 . D2 . D2 . D2 . D2 .  D2 . D2 . D2 . D2 . D2 . D2 . D2 . D2 .  A#1 . A#1 . A#1 . A#1 . A#1 . A#1 . A#1 . A#1 .  A1 . A1 . A1 . A1 . A1 . A1 . A1 . A1 ."),
  step:function(t,s){var b=s&15;
    if(this.mel[s]!=='.')organ(t,fq(this.mel[s]),.22,.07);
    if(this.bas[s]!=='.')bassV(t,fq(this.bas[s]),.11,.17);
    if(b===0||b===7||b===10)kick(t,.44);
    if(b===4||b===12)clap(t,.14);
    hat(t,b%2===0?.026:.012);}}
];

function schedule(){
  var spb=60/TRACKS[curTrack].bpm/4;             /* 16분음표 */
  while(nextT < AC.currentTime+0.14){
    try{ TRACKS[curTrack].step(nextT,stepIdx); }catch(e){}
    nextT += spb; stepIdx=(stepIdx+1)%64;
  }
}
function startPlay(){
  if(!AC)initAudio(); if(!AC)return;
  if(AC.state==='suspended')AC.resume();
  playing=true; stepIdx=0; nextT=AC.currentTime+.08;
  MASTER.gain.cancelScheduledValues(AC.currentTime);
  MASTER.gain.setValueAtTime(MASTER.gain.value,AC.currentTime);
  MASTER.gain.linearRampToValueAtTime(0.5,AC.currentTime+1.1);
  clearInterval(schedTimer); schedTimer=setInterval(schedule,25);
  paint();
}
function stopPlay(){
  playing=false;
  if(AC&&MASTER){MASTER.gain.cancelScheduledValues(AC.currentTime);
    MASTER.gain.setValueAtTime(MASTER.gain.value,AC.currentTime);
    MASTER.gain.linearRampToValueAtTime(0,AC.currentTime+.35);}
  setTimeout(function(){clearInterval(schedTimer);},420);
  paint();
}
/* 사용자 제스처 시점에 호출 — 설정이 켜져 있으면 재생 시작 */
function kickAudio(){
  if(localStorage.getItem('rookie.music.off')==='1')return;
  if(playing)return;
  startPlay();
  if(AC&&AC.state!=='running'){ hint('🎵 화면을 한 번 탭하면 음악이 시작돼요'); }
}
function hint(msg){
  var h=document.getElementById('musHint'); if(!h)return;
  h.textContent=msg; h.classList.add('show');
  setTimeout(function(){h.classList.remove('show');},3200);
}

/* ── 컨트롤 UI ── */
function paint(){
  var btn=document.getElementById('musBtn');
  btn.classList.toggle('on',playing);
  document.getElementById('trList').innerHTML=TRACKS.map(function(t,i){
    return '<button class="tr'+(i===curTrack&&playing?' sel':'')+'" onclick="pick('+i+')">'+
      '<span class="ic">'+t.ic+'</span><span><b>'+t.name+'</b><span>'+t.desc+'</span></span></button>';
  }).join('');
}
function togglePanel(){
  var p=document.getElementById('musPanel');
  p.classList.toggle('open');
  if(p.classList.contains('open'))paint();
}
function pick(i){
  curTrack=i; localStorage.setItem('rookie.music.track',i);
  localStorage.removeItem('rookie.music.off');
  if(!AC)initAudio();
  if(AC&&AC.state==='suspended')AC.resume();
  stepIdx=0; if(AC)nextT=AC.currentTime+.06;
  startPlay();
  setTimeout(function(){document.getElementById('musPanel').classList.remove('open');},650);
}
function musOff(){
  localStorage.setItem('rookie.music.off','1');
  stopPlay();
  document.getElementById('musPanel').classList.remove('open');
}
try{ var sv=localStorage.getItem('rookie.music.track'); if(sv!==null)curTrack=+sv||0; }catch(e){}
paint();

/* 첫 제스처에 오디오 해금 (부모/자식 프레임 모두) */
['pointerdown','touchstart','keydown'].forEach(function(ev){
  window.addEventListener(ev,function once(){ kickAudio();
    ['pointerdown','touchstart','keydown'].forEach(function(e2){window.removeEventListener(e2,once);});
  },{once:false,passive:true});
});

</script>
