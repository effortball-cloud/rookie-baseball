<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROOKIE B — 새 주소로 이동합니다</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://effortball-cloud.github.io/rookieb/">
<meta http-equiv="refresh" content="0; url=https://effortball-cloud.github.io/rookieb/">
<script>
/* 루키 → ROOKIE B 주소 변경 (2026-10-07): /rookie-baseball/… → /rookieb/… 로 그대로 옮긴다 (?p=·?sport=·카카오 복귀 code 포함) */
(function(){
  var rest=location.pathname.replace(/^\/rookie-baseball\/?/,'');
  location.replace('https://effortball-cloud.github.io/rookieb/'+rest+location.search+location.hash);
})();
/* 예전에 설치한 앱(PWA)의 서비스 워커를 정리 */
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if(r.scope.indexOf('/rookie-baseball/')>=0)r.unregister();});});}
</script>

</head><body>

</body></html>
